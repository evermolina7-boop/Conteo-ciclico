<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Conteo cíclico</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{--bg:#f6f4f3;--sf:#fff;--tx:#1d1b1b;--mu:#6b6462;--ac:#9b1c31;--ln:#ddd5d2;--ok:#1b7f3b;--bad:#c62828;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171414;--sf:#231f1f;--tx:#f1ecea;--mu:#a39b98;--ac:#e0566d;--ln:#3a3333;--ok:#5cc47a;--bad:#ff7b7b;color-scheme:dark}}
:root[data-theme=dark]{--bg:#171414;--sf:#231f1f;--tx:#f1ecea;--mu:#a39b98;--ac:#e0566d;--ln:#3a3333;--ok:#5cc47a;--bad:#ff7b7b;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:12px}h1{margin:8px 0 0;color:var(--ac);font-size:22px}.mu{color:var(--mu);font-size:13px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 0}
input,select{width:100%;box-sizing:border-box;padding:9px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);color:var(--tx);font-size:15px}
button,.btn{display:block;width:100%;box-sizing:border-box;margin:10px 0 0;padding:12px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-size:15px;font-weight:600;text-align:center;cursor:pointer}
.b2{background:var(--sf);color:var(--tx);border:1px solid var(--ln)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:5}.bar b{color:var(--ac)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;margin:10px 0;overflow:hidden}
.card header{padding:8px 10px;border-bottom:1px solid var(--ln);font-size:14px}.card header span{float:right;font-weight:700}
.row{padding:8px 10px;border-bottom:1px dashed var(--ln)}.row:last-child{border:0}.meta{font-size:12px;color:var(--mu)}
.ins{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.ins input{padding:7px}
.sum{font-size:13px;margin-top:6px}.ok{color:var(--ok)}.bad{color:var(--bad)}.tag{background:#ffc000;color:#000;border-radius:4px;padding:0 5px;font-size:11px;font-weight:700}.mini{width:auto;display:inline-block;margin:0;padding:7px 10px;font-size:13px}.panel{background:var(--sf);border:1px solid var(--ac);border-radius:10px;padding:8px 10px;margin:10px 0}.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}footer{text-align:center;color:var(--mu);font-size:12px;padding:16px 0}
</style></head><body>
<main id="s1"><h1>Conteo cíclico</h1><div class="mu">C. Imberton · Almacén Farmacia</div>
<label class="btn" style="color:#fff;font-size:15px">1. Cargar existencia (Excel)<input id="file" type="file" accept=".xlsx,.xls,.csv" hidden></label>
<div id="cfg" hidden><label>Marca<select id="m"></select></label>
<label>Nombre de la marca (opcional)<input id="n" placeholder="ej. ABBOTT FARMACEUTICA"></label>
<label>Fecha del conteo<input id="dt" type="date"></label><button id="go">Iniciar conteo</button></div>
<p id="msg" class="mu"></p></main>
<main id="s2" hidden><div class="bar"><b id="ttl"></b> · <span id="st"></span><input id="q" type="search" placeholder="Buscar código o descripción"></div>
<button id="nw" class="b2">+ Agregar código que no está en la existencia</button>
<div id="pn" class="panel" hidden><b id="pt"></b>
<div class="g2"><label>Código<input id="ac" inputmode="numeric" autocomplete="off"></label><label>Org<input id="ao"></label></div>
<label>Descripción<input id="ad" autocomplete="off"></label>
<div class="g2"><label>Subinventario<input id="as" list="sl" autocomplete="off"></label><label>Lote<input id="al" autocomplete="off"></label></div><datalist id="sl"></datalist>
<div class="g2"><label>Vence<input id="av" type="date"></label><label>Costo unitario (opcional)<input id="ak" inputmode="decimal"></label></div>
<p class="mu">La cantidad contada la digitas después en la fila agregada.</p>
<button id="aok">Agregar</button><button id="acx" class="b2">Cancelar</button><p id="am" class="bad"></p></div>
<div id="list"></div>
<button id="ex">Exportar Excel</button><button id="sh" class="b2">Compartir mi conteo (archivo)</button>
<label class="btn b2" style="color:var(--tx);font-size:15px">Unir conteos de otros teléfonos<input id="mg" type="file" accept=".json" multiple hidden></label>
<button id="bk" class="b2">Cambiar marca</button><p id="msg2" class="mu"></p></main>
<footer>Powered by Ever Molina</footer>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F=[['p','Pasillos'],['a','Nave A'],['c','Cuarentena'],['f','Facturas p.'],['h','Altas p.']];
const nz=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const nf=s=>String(s||'').replace(/,/g,'.').replace(/\s/g,'').split('+').filter(Boolean).join('+');
const ev=s=>/^[\d.+]+$/.test(nf(s))?nf(s).split('+').reduce((a,x)=>a+(parseFloat(x)||0),0):0;
const tot=r=>F.reduce((a,[k])=>a+ev(r.f[k]),0),has=r=>F.some(([k])=>nf(r.f[k]))||r.lf;
const iso=v=>{if(v===''||v==null)return'';if(typeof v==='number')return new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5).toISOString().slice(0,10);const d=new Date(v);return isNaN(d)?'':d.toISOString().slice(0,10)};
const fv=v=>v?v.split('-').reverse().join('/'):'';const key=r=>[r.c,r.s,r.l].join('|');
let S=null,RAW=[],G=[],GI=[],tm;
const msg=(t,id='msg')=>$('#'+id).textContent=t;
$('#dt').value=new Date().toISOString().slice(0,10);
$('#file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const wb=XLSX.read(await f.arrayBuffer()),js=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{raw:true,defval:''});
const hs=Object.keys(js[0]||{}),fd=fn=>hs.find(h=>fn(nz(h)));
const M={c:fd(h=>h.startsWith('articulo')&&!h.includes('unidad')),d:fd(h=>h.includes('descrip')),s:fd(h=>h.includes('subinv')),o:fd(h=>h.includes('organiz')),q:fd(h=>h.startsWith('cantidad')),v:fd(h=>/caduc|vence/.test(h)),l:fd(h=>h.startsWith('lote')),k:fd(h=>h.includes('costo'))};
if(!M.c||!M.q)return msg('No encontré las columnas Artículo y Cantidad.');
RAW=js.filter(r=>r[M.c]!=='').map(r=>{let c=String(r[M.c]).trim();if(/^\d+$/.test(c))c=c.padStart(7,'0');return{c,d:String(r[M.d]||'').trim(),o:r[M.o]||'',s:r[M.s]||'',l:String(r[M.l]??'').trim(),v:iso(r[M.v]),q:+r[M.q]||0,k:M.k&&r[M.k]!==''?+r[M.k]:null,f:{},lf:''}});
const ct={};RAW.forEach(r=>ct[r.c.slice(0,3)]=(ct[r.c.slice(0,3)]||0)+1);
$('#m').innerHTML=Object.keys(ct).sort().map(k=>`<option value="${k}">${k} · ${ct[k]} líneas</option>`).join('');
$('#cfg').hidden=false;msg(RAW.length+' líneas cargadas.')}catch(x){msg('No pude leer el archivo.')}};
$('#go').onclick=()=>{const m=$('#m').value,d=$('#dt').value;S={m,n:$('#n').value.trim().toUpperCase(),iso:d,fecha:d.split('-').reverse().join('.'),id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),g:[],rows:RAW.filter(r=>r.c.startsWith(m))};
try{const j=JSON.parse(localStorage.getItem('cc:'+m+':'+d)||'[]'),a=Array.isArray(j)?j:j.r||[];S.g=j.g||[];S.id=j.id||S.id;(j.x||[]).filter(r=>!S.rows.some(x=>key(x)===key(r))).forEach(insRow);a.forEach(([k,f,lf])=>{const r=S.rows.find(x=>key(x)===k);if(r){r.f=f;r.lf=lf}})}catch(x){}
$('#s1').hidden=true;$('#s2').hidden=false;$('#ttl').textContent=m+' '+S.n;render()};
$('#bk').onclick=()=>{$('#s2').hidden=true;$('#s1').hidden=false};
function render(){G=[];GI=[];let L;S.rows.forEach((r,i)=>{if(!L||L.c!==r.c){L={c:r.c,d:r.d,ix:[]};G.push(L)}L.ix.push(i);GI[i]=G.length-1});
$('#list').innerHTML=G.map((g,n)=>`<section class="card" data-q="${E(nz(g.c+' '+g.d))}"><header><b>${E(g.c)}</b> ${E(g.d)}<span id="gd${n}"></span></header>${g.ix.map(i=>{const r=S.rows[i];return`<div class="row" data-i="${i}"><div class="meta">${E(r.s)} · Lote ${E(r.l)} · Vence ${fv(r.v)} · ${r.x?`<span class="tag">AGREGADO</span> <u data-rm="${i}" style="cursor:pointer;color:var(--bad)">Quitar</u>`:`<b>ERP ${r.q}</b>`}</div><div class="ins">${F.map(([k,t])=>`<label>${t}<input data-k="${k}" autocomplete="off" value="${E(r.f[k]||'')}"></label>`).join('')}<label>Lote físico<input data-k="lf" placeholder="${E(r.l)}" value="${E(r.lf)}"></label></div><div class="sum">Total <b class="t"></b> · Dif <b class="df"></b></div></div>`}).join('')}<div style="padding:6px 10px"><button class="b2 mini" data-add="${n}">+ Agregar lote de este código</button></div></section>`).join('');
S.rows.forEach((_,i)=>upd(i));G.forEach((_,n)=>gdif(n));stat()}
function upd(i){const r=S.rows[i],el=$(`[data-i="${i}"]`),t=tot(r),h=F.some(([k])=>nf(r.f[k]));el.querySelector('.t').textContent=h?t:'—';const d=el.querySelector('.df');d.textContent=h?t-r.q:'—';d.className='df '+(h?(t-r.q?'bad':'ok'):'')}
function gdif(n){const ix=G[n].ix,h=ix.some(i=>F.some(([k])=>nf(S.rows[i].f[k]))),d=ix.reduce((a,i)=>a+tot(S.rows[i])-S.rows[i].q,0),e=$('#gd'+n);e.textContent=h?(d?'Dif '+d:'✓ OK'):'pendiente';e.className=h?(d?'bad':'ok'):''}
function stat(){$('#st').textContent=G.filter(g=>g.ix.some(i=>F.some(([k])=>nf(S.rows[i].f[k])))).length+' de '+G.length+' SKU contados'}
function sv(){clearTimeout(tm);tm=setTimeout(()=>{try{localStorage.setItem('cc:'+S.m+':'+S.iso,JSON.stringify({r:S.rows.filter(has).map(r=>[key(r),r.f,r.lf]),x:S.rows.filter(r=>r.x),g:S.g,id:S.id}))}catch(x){}},400)}
$('#list').oninput=e=>{const t=e.target,k=t.dataset.k;if(!k)return;const i=+t.closest('.row').dataset.i,r=S.rows[i];if(k==='lf')r.lf=t.value.trim();else r.f[k]=t.value;upd(i);gdif(GI[i]);stat();sv()};
function insRow(r){let p=-1;S.rows.forEach((x,i)=>{if(x.c===r.c)p=i});if(p>=0){S.rows.splice(p+1,0,r);return}p=S.rows.findIndex(x=>x.c>r.c);if(p<0)S.rows.push(r);else S.rows.splice(p,0,r)}
function openAdd(g){const f=g?S.rows[g.ix[0]]:{o:(S.rows[0]||{}).o||'IML',s:'',k:null};$('#sl').innerHTML=[...new Set(RAW.map(r=>r.s).filter(Boolean))].map(s=>`<option value="${E(s)}">`).join('');
$('#pt').textContent=g?'Agregar lote a '+g.c:'Agregar código que no está en la existencia';$('#ac').value=g?g.c:S.m;$('#ac').readOnly=!!g;$('#ad').value=g?g.d:'';$('#ad').readOnly=!!g;$('#ao').value=f.o;$('#as').value=f.s;$('#al').value='';$('#av').value='';$('#ak').value=f.k??'';$('#am').textContent='';$('#pn').hidden=false;$('#pn').scrollIntoView({block:'center'})}
$('#nw').onclick=()=>openAdd(null);$('#acx').onclick=()=>$('#pn').hidden=true;
$('#aok').onclick=()=>{const c=$('#ac').value.trim(),l=$('#al').value.trim(),m=t=>$('#am').textContent=t;if(!c.startsWith(S.m))return m('El código debe empezar con '+S.m+'.');if(!l)return m('Escribe el lote.');
const ex=S.rows.filter(r=>r.c===c),d=$('#ad').value.trim()||(ex[0]||{}).d||'';if(!d)return m('Escribe la descripción.');
const k=parseFloat($('#ak').value.replace(',','.')),r={c,d,o:$('#ao').value.trim(),s:$('#as').value.trim(),l,v:$('#av').value,q:0,k:isNaN(k)?((ex[0]||{}).k??null):k,f:{},lf:'',x:1};
if(S.rows.some(x=>key(x)===key(r)))return m('Ese código, subinventario y lote ya está en la lista.');insRow(r);$('#pn').hidden=true;render();sv()};
$('#list').onclick=e=>{const t=e.target;if(t.dataset.rm!=null){S.rows.splice(+t.dataset.rm,1);render();sv()}else if(t.dataset.add!=null)openAdd(G[+t.dataset.add])};
$('#q').oninput=e=>{const v=nz(e.target.value);document.querySelectorAll('.card').forEach(c=>c.hidden=!c.dataset.q.includes(v))};
async function save(name,data,t){let d=null;try{d=window.claude&&await claude.use('downloads')}catch(x){}
if(d){try{await d.save({filename:name,data});return}catch(x){if(x&&x.code==='declined')return}}
const a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type:t}));a.download=name;a.click()}
$('#sh').onclick=()=>save(`conteo_${S.m}_${S.fecha.replace(/\./g,'')}_${Date.now()%100000}.json`,JSON.stringify({m:S.m,i:S.iso,id:S.id,rows:S.rows.filter(has).map(r=>[key(r),r.f,r.lf]),x:S.rows.filter(r=>r.x)}),'application/json');
$('#mg').onchange=async e=>{let n=0,c=0;for(const f of e.target.files){try{const j=JSON.parse(await f.text());if(j.m!==S.m){msg('Ese archivo es de otra marca ('+j.m+').','msg2');continue}if(j.id){if(j.id===S.id||S.g.includes(j.id)){msg('Ese archivo ya se unió o es el tuyo: '+f.name,'msg2');continue}S.g.push(j.id)}
(j.x||[]).filter(r=>!S.rows.some(x=>key(x)===key(r))).forEach(r=>insRow({...r,f:{},lf:''}));j.rows.forEach(([k,fl,lf])=>{const r=S.rows.find(x=>key(x)===k);if(!r)return;F.forEach(([q])=>{if(!nf(fl[q]))return;if(!nf(r.f[q]))r.f[q]=fl[q];else{r.f[q]=nf(r.f[q])+'+'+nf(fl[q]);c++}});if(lf&&!r.lf)r.lf=lf;n++})}catch(x){msg('No pude leer '+f.name,'msg2')}}
e.target.value='';render();sv();msg(`Se unieron ${n} líneas. Cantidades sumadas a lo ya digitado: ${c}.`,'msg2')};
$('#ex').onclick=async()=>{try{await xl()}catch(x){msg('Error al exportar: '+x.message,'msg2')}};
async function xl(){const W=new ExcelJS.Workbook(),ws=W.addWorksheet((S.m+' '+S.n).trim().slice(0,31),{views:[{state:'frozen',ySplit:7,zoomScale:85}]});
const hair={style:'hair'},bd={top:hair,left:hair,bottom:hair,right:hair},th={style:'thin'},fl=c=>({type:'pattern',pattern:'solid',fgColor:{argb:'FF'+c}});
const ACC='_-"$"* #,##0.00_-;\\-"$"* #,##0.00_-;_-"$"* "-"??_-;_-@_-';
[5.6,9.7,8.7,61,8.7,20.7,14.4,11.4,11.4,21,13.4,11.4,10.9,16.3,13.7,10.1,8,7.4,13.4,14,14,3.6,7,11.4,11.4,11.4].forEach((w,i)=>ws.getColumn(i+1).width=w);
const st=(c,o={})=>{c.font={name:'Arial',size:10,bold:!!o.b,italic:!!o.i};if(o.h)c.alignment={horizontal:o.h,vertical:'middle',wrapText:true};if(o.f)c.fill=fl(o.f);if(!o.nb)c.border=bd;if(o.n)c.numFmt=o.n};
for(let r=1;r<=3;r++)for(let c=1;c<=10;c++){const x=ws.getCell(r,c);st(x,{nb:1,b:(r!==2)&&c<=10});x.border={top:r==1?th:undefined,bottom:r==3?th:undefined,left:c==1?th:undefined,right:c==10?th:undefined}}
const V=(a,v,o)=>{const c=ws.getCell(a);c.value=v;if(o)st(c,o)};
V('A1','C. IMBERTON ',{b:1,nb:1});V('A2','"DISTRIBUYENDO MARCAS LIDERES"',{i:1,nb:1});V('A3','UNIDAD DE INVENTARIOS ALMACEN FARMACIA',{b:1,nb:1});V('I1','FECHA:',{b:1,nb:1});V('J1',S.fecha,{b:1,nb:1});V('I2','CONTEO CICLICO',{b:1,nb:1});
ws.getCell('A2').font={name:'Arial',size:10,italic:true};ws.getCell('J1').border={top:th,bottom:th,left:th,right:th};
for(let r=6;r<=7;r++)for(let c=1;c<=26;c++)st(ws.getCell(r,c),{b:1,h:'center'});
['A6:A7','B6:B7','C6:C7','D6:D7','E6:I6','J6:P6','Q6:Q7','R6:R7','S6:U6','X6:Y6','Z6:Z7'].forEach(m=>ws.mergeCells(m));
const T={A6:'N°',B6:'Codigo',C6:'Marca',D6:'Descripcion',E6:'Cantidad Sistema ERP',J6:'Cantidad Fisica',Q6:'Total Fisico',R6:'Dif',S6:'Costo',W6:'Dif',X6:'Ajuste',Z6:'Sku con diferencia',W7:'Total',X7:'A Favor',Y7:'En Contra'};
for(const a in T)ws.getCell(a).value=T[a];
['Org','Subinventario','Lote','Vence','Cantidad','Lote','Vence','Pasillos','NAVE A','CURENTENA','facturas p.','altas p.'].forEach((t,i)=>ws.getCell(7,5+i).value=t);
['Unitario','Teorico','Fisico'].forEach((t,i)=>ws.getCell(7,19+i).value=t);
['I7','Q6','Q7'].forEach(a=>ws.getCell(a).fill=fl('FFE699'));['V6','V7'].forEach(a=>ws.getCell(a).fill=fl('70AD47'));
const sep=(r,end)=>{for(let c=1;c<=26;c++){const x=ws.getCell(r,c);x.border=bd;if(c>1)x.fill=fl(c==22&&!end?'70AD47':'C6E0B4')}};
const dt=v=>v?new Date(v+'T00:00:00Z'):null;let r=8,n=0,sI=0,sQ=0,sT=0,sU=0,sZ=0;sep(r);r++;
G.forEach(g=>{n++;const a=r,z=r+g.ix.length-1,gd=g.ix.reduce((s,i)=>s+tot(S.rows[i])-S.rows[i].q,0);
g.ix.forEach((i,k)=>{const x=S.rows[i],t=tot(x),row=a+k,cs=x.k||0;
[n,x.c,x.c.slice(0,3),x.d,x.o,x.s,x.x?null:x.l,x.x?null:dt(x.v),x.x?null:x.q,x.lf||x.l,dt(x.v)].forEach((v,j)=>ws.getCell(row,j+1).value=v);
F.forEach(([q],j)=>{const s=nf(x.f[q]);if(!s)return;ws.getCell(row,12+j).value=/^[\d.]+$/.test(s)?+s:(/^[\d.+]+$/.test(s)?{formula:s,result:ev(s)}:null)});
const set=(c,f,res)=>ws.getCell(row,c).value={formula:f,result:res};
set(17,`SUM(L${row}:P${row})`,t);set(18,`SUM(Q${row}-I${row})`,t-x.q);if(x.k!=null)ws.getCell(row,19).value=x.k;
set(20,`S${row}*I${row}`,cs*x.q);set(21,`S${row}*Q${row}`,cs*t);
if(k==0)set(23,a==z?`SUM(R${a})`:`SUM(R${a}:R${z})`,gd);set(26,`IF(W${row}>0,1,IF(W${row}<0,1,0))`,k==0&&gd?1:0);
for(let c=1;c<=26;c++)st(ws.getCell(row,c),{h:[1,2,3,5,6,7,8,10,11].includes(c)?'center':null,n:c==8||c==11?'m/d/yyyy':c==19?'0.00':(c==20||c==21)?ACC:null,f:c==22?'70AD47':(c==18||(c==23&&k==0))?'FFFF00':null});
sI+=x.q;sQ+=t;sT+=cs*x.q;sU+=cs*t;if(k==0&&gd)sZ++});
r=z+1;sep(r);r++});
const se=r-1;sep(se,true);const last=se-1;ws.getCell(se,26).value={formula:`SUM(Z9:Z${last})`,result:sZ};
[[9,`SUM(I9:I${last})`,sI],[17,`SUM(Q9:Q${last})`,sQ],[20,`SUM(T9:T${se})`,sT],[21,`SUM(U9:U${se})`,sU]].forEach(([c,f,v])=>{const x=ws.getCell(se+1,c);x.value={formula:f,result:v};st(x,{nb:1,n:c>=20?ACC:null})});
const buf=await W.xlsx.writeBuffer();await save(`CONTEO_${S.m}_${S.fecha.replace(/\./g,'')}.xlsx`,buf,'application/octet-stream');msg('Excel generado.','msg2')}
</script></body></html>
